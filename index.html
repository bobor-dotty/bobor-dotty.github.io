<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>我的成长档案 · 目标微电子 · 一生一芯预备</title>
  <meta name="description" content="一名大一学生的公开成长档案：记录微电子学习、生活日志与项目，为「一生一芯」申请做准备。">

  <script>
    // 在页面绘制前应用主题，避免暗色模式下白屏闪烁。
    // 手动选择存 localStorage；未选择时跟随系统 prefers-color-scheme。
    (function () {
      try {
        var pref = localStorage.getItem("ysyx-portfolio-theme") || "auto";
        var dark = pref === "dark" ||
          (pref === "auto" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      } catch (e) { /* 忽略隐私模式等场景下的读取失败 */ }
    })();
  </script>

  <style>
    /* ============================================================
       1. 设计令牌（CSS 变量）
       亮色为默认，暗色通过 [data-theme="dark"] 覆盖。
       ============================================================ */
    :root {
      --bg: #f6f7f9;
      --bg-elevated: #ffffff;
      --card: #ffffff;
      --text: #1b1d21;
      --text-muted: #565b63;
      --border: #e4e6ea;
      --border-strong: #d3d6dc;
      --accent: #2456a6;
      --accent-strong: #1b4280;
      --accent-soft: #eef3fb;
      --code-bg: #f0f2f5;
      --code-text: #24272d;
      --shadow: 0 1px 2px rgba(16, 24, 40, .05), 0 6px 20px rgba(16, 24, 40, .06);
      --focus-ring: rgba(36, 86, 166, .4);
      --danger: #b42318;
      --danger-soft: #fbeae8;
      --like: #d24a4a;
      --amber: #b7791f;
      --amber-soft: #fbf0dd;
      --header-bg: rgba(255, 255, 255, .84);
      --font-sans: "Segoe UI Variable", "Segoe UI", "PingFang SC", "HarmonyOS Sans SC", "MiSans", "Source Han Sans SC", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, -apple-system, sans-serif;
      --font-display: "Avenir Next", "SF Pro Display", "Segoe UI Variable", "PingFang SC", "HarmonyOS Sans SC", "MiSans", "Microsoft YaHei", sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "JetBrains Mono", monospace;
    }

    :root[data-theme="dark"] {
      --bg: #111318;
      --bg-elevated: #17181c;
      --card: #1a1c22;
      --text: #e8e9ec;
      --text-muted: #9da1aa;
      --border: #2b2e36;
      --border-strong: #3b3f49;
      --accent: #7ba4e8;
      --accent-strong: #9dbcff;
      --accent-soft: #1f2836;
      --code-bg: #22242a;
      --code-text: #e8e9ec;
      --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 8px 24px rgba(0, 0, 0, .35);
      --focus-ring: rgba(123, 164, 232, .5);
      --danger: #e07065;
      --danger-soft: #33201f;
      --like: #e07373;
      --header-bg: rgba(18, 19, 22, .84);
    }

    /* 无 JS 时的系统暗色兜底（JS 正常时会通过 data-theme 覆盖） */
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #111318;
        --bg-elevated: #17181c;
        --card: #1a1c22;
        --text: #e8e9ec;
        --text-muted: #9da1aa;
        --border: #2b2e36;
        --border-strong: #3b3f49;
        --accent: #7ba4e8;
        --accent-strong: #9dbcff;
        --accent-soft: #1f2836;
        --code-bg: #22242a;
        --code-text: #e8e9ec;
        --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 8px 24px rgba(0, 0, 0, .35);
        --focus-ring: rgba(123, 164, 232, .5);
        --danger: #e07065;
        --danger-soft: #33201f;
        --like: #e07373;
        --header-bg: rgba(18, 19, 22, .84);
      }
    }

    /* ============================================================
       2. 基础重置与排版
       ============================================================ */
    *, *::before, *::after { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      font-weight: 400;
      line-height: 1.75;
      font-size: 16px;
      -webkit-font-smoothing: antialiased;
    }

    h1, h2, h3, h4 { font-family: var(--font-display); line-height: 1.28; font-weight: 750; margin: 0 0 .55em; letter-spacing: -.01em; }
    p { margin: 0 0 1em; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    button { font-family: inherit; font-size: inherit; color: inherit; }
    img { max-width: 100%; }

    :focus-visible {
      outline: 3px solid var(--focus-ring);
      outline-offset: 2px;
      border-radius: 4px;
    }

    .sr-only {
      position: absolute; width: 1px; height: 1px;
      padding: 0; margin: -1px; overflow: hidden;
      clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
    }

    .skip-link {
      position: absolute; left: -9999px; top: 0;
      background: var(--accent); color: #fff; padding: .6rem 1rem; z-index: 100;
    }
    .skip-link:focus { left: 1rem; top: 1rem; }

    .container { max-width: 720px; margin: 0 auto; padding: 0 1.25rem; }

    main { display: block; }

    section[id] { scroll-margin-top: 5rem; }

    /* ============================================================
       3. 顶部导航
       ============================================================ */
    .site-header {
      position: sticky; top: 0; z-index: 50;
      background: var(--header-bg);
      backdrop-filter: saturate(180%) blur(12px);
      border-bottom: 1px solid transparent;
      transition: border-color .25s ease, box-shadow .25s ease;
    }
    .site-header.scrolled {
      border-bottom-color: var(--border);
      box-shadow: var(--shadow);
    }
    .header-inner {
      max-width: 960px; margin: 0 auto; padding: .45rem 1rem;
      display: flex; align-items: center; gap: .6rem;
    }
    .brand {
      font-weight: 700; color: var(--text); font-size: .92rem;
      letter-spacing: .02em; margin-right: auto; white-space: nowrap;
    }
    .brand .dot { color: var(--accent); }

    .site-nav { display: flex; align-items: center; }
    .nav-list {
      list-style: none; margin: 0; padding: 0; display: flex; gap: .25rem;
    }
    .nav-list a {
      display: inline-block; padding: .35rem .6rem; border-radius: 7px;
      color: var(--text-muted); font-size: .78rem; white-space: nowrap;
      letter-spacing: .01em;
    }
    .nav-list a:hover { color: var(--text); text-decoration: none; }
    .nav-list a.active { color: var(--accent); background: var(--accent-soft); }

    .header-actions { display: flex; align-items: center; gap: .4rem; }

    .icon-btn, .like-btn, .btn {
      cursor: pointer; border: 1px solid transparent; background: transparent;
    }

    .theme-toggle {
      width: 2.25rem; height: 2.25rem; border-radius: 8px;
      border: 1px solid var(--border); background: var(--card);
      font-size: 1rem; display: inline-flex; align-items: center; justify-content: center;
    }
    .theme-toggle:hover { border-color: var(--border-strong); }

    .edit-toggle {
      border: 1px solid var(--border); background: var(--card);
      padding: .42rem .7rem; border-radius: 8px; font-size: .9rem;
      color: var(--text); white-space: nowrap;
    }
    .edit-toggle:hover { border-color: var(--accent); color: var(--accent); }
    .edit-toggle[aria-pressed="true"] {
      background: var(--accent); border-color: var(--accent); color: #fff;
    }

    .nav-toggle {
      width: 2.25rem; height: 2.25rem; border-radius: 8px;
      border: 1px solid var(--border); background: var(--card);
      font-size: 1.05rem; display: none; align-items: center; justify-content: center;
    }

    /* 移动端：导航收起为汉堡菜单 */
    @media (max-width: 767px) {
      .nav-toggle { display: inline-flex; }
      .site-nav {
        position: absolute; left: 0; right: 0; top: 100%;
      }
      .nav-list {
        display: none; flex-direction: column; gap: 2px;
        background: var(--bg-elevated); border-bottom: 1px solid var(--border);
        padding: .5rem 1rem 1rem; box-shadow: var(--shadow);
      }
      .site-nav.open .nav-list { display: flex; }
      .nav-list a { display: block; padding: .55rem .6rem; }
      .edit-toggle { padding: .4rem .55rem; font-size: .85rem; }
    }

    /* ============================================================
       4. Hero 首屏
       ============================================================ */
    .hero { padding: 7rem 0 5rem; }
    .hero-kicker {
      font-size: .88rem; color: var(--text-muted);
      letter-spacing: .04em; margin: 0 0 1.75rem;
    }
    .hero-title {
      font-size: clamp(2.8rem, 9vw, 5.5rem); line-height: 1.04;
      margin-bottom: 1.35rem; max-width: 16em;
      font-weight: 800; letter-spacing: -.04em;
    }
    .hero-lede {
      font-size: clamp(1.05rem, 2.4vw, 1.3rem); line-height: 1.6;
      color: var(--text); max-width: 32em; margin: 0 0 1.5rem;
    }
    .hero-meta { color: var(--text-muted); font-size: .9rem; margin: 0 0 1.75rem; }
    .hero-meta b { color: var(--text); font-weight: 700; }
    .hero-meta .stage-now { color: var(--amber); }
    .focus-list { list-style: none; margin: 0 0 .5rem; padding: 0; counter-reset: focus; }
    .focus-list li {
      position: relative; padding-left: 2rem; margin-bottom: .55rem;
      counter-increment: focus;
    }
    .focus-list li::before {
      content: counter(focus, decimal-leading-zero);
      position: absolute; left: 0; top: .05em;
      font-family: var(--font-mono); font-size: .82rem; color: var(--text-muted);
    }

    .hero-actions { display: flex; flex-wrap: wrap; gap: .6rem; }
    .text-link {
      font-size: .92rem; text-decoration: none;
      background-image: linear-gradient(currentColor, currentColor);
      background-size: 0 1px; background-position: 0 100%; background-repeat: no-repeat;
      transition: background-size .3s ease, color .2s ease; padding-bottom: 1px;
    }
    .text-link:hover { background-size: 100% 1px; text-decoration: none; color: var(--accent-strong); }

    .search-wrap {
      margin: 0 0 2.75rem; max-width: 720px; margin-left: auto; margin-right: auto;
      padding: 0 1.25rem;
    }
    .search-wrap label { display: block; font-size: .85rem; color: var(--text-muted); margin-bottom: .4rem; }
    .search-input {
      width: 100%; padding: .7rem .9rem; font-size: 1rem;
      border: 1px solid var(--border); border-radius: 10px; background: var(--card); color: var(--text);
    }
    .search-input::placeholder { color: var(--text-muted); }

    /* ============================================================
       5. 区块通用
       ============================================================ */
    .section { padding: 6rem 0; }
    .section-head {
      display: flex; align-items: baseline; justify-content: space-between;
      gap: 1rem; margin-bottom: 2rem; flex-wrap: wrap;
    }
    .section-head h2 {
      font-size: clamp(1.8rem, 5vw, 2.5rem);
      margin: 0; font-weight: 800; letter-spacing: -.025em; line-height: 1.1;
    }
    @media (max-width: 767px) { .section { padding: 4rem 0; } }

    /* ============================================================
       6. 按钮
       ============================================================ */
    .btn {
      display: inline-flex; align-items: center; gap: .4rem;
      padding: .55rem 1rem; border-radius: 10px; font-size: .92rem;
      border: 1px solid var(--border); background: var(--card); color: var(--text);
      transition: transform .2s ease, border-color .2s ease, background .2s ease, color .2s ease;
    }
    .btn:hover { border-color: var(--border-strong); text-decoration: none; transform: translateY(-1px); }
    .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-strong); border-color: var(--accent-strong); }
    .btn-danger { background: var(--danger); border-color: var(--danger); color: #fff; }
    .btn-danger:hover { background: #8f1d14; }
    .btn-sm { padding: .35rem .7rem; font-size: .85rem; }
    .btn-row { display: flex; flex-wrap: wrap; gap: .5rem; }

    /* 编辑模式才显示的元素（!important 保证不被后面的 .btn / .icon-btn 等覆盖） */
    .edit-only { display: none !important; }
    body.edit-mode .edit-only { display: inline-flex !important; }

    /* ============================================================
       7. 卡片、标签、点赞
       ============================================================ */
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 1.1rem 1.15rem; box-shadow: var(--shadow);
    }
    .card-meta {
      display: flex; align-items: center; gap: .6rem; flex-wrap: wrap;
      font-size: .82rem; color: var(--text-muted); margin-bottom: .55rem;
    }
    .card-meta .item-actions { margin-left: auto; }
    .cat {
      color: var(--text-muted); font-size: .8rem;
    }
    .card-title { font-size: 1.12rem; margin: 0 0 .4rem; }
    .card-summary { color: var(--text-muted); margin-bottom: .7rem; }
    .card-foot {
      display: flex; align-items: center; justify-content: space-between;
      gap: .75rem; flex-wrap: wrap; margin-top: .85rem;
    }

    .tags { display: flex; flex-wrap: wrap; gap: .4rem; }
    .tag {
      background: var(--accent-soft); color: var(--accent);
      padding: .12rem .55rem; border-radius: 999px; font-size: .78rem;
    }

    .item-actions { display: inline-flex; align-items: center; gap: .35rem; }
    .icon-btn {
      width: 1.9rem; height: 1.9rem; border-radius: 10px; font-size: .92rem;
      border: 1px solid var(--border); background: var(--card);
      display: inline-flex; align-items: center; justify-content: center;
    }
    .icon-btn:hover { border-color: var(--accent); color: var(--accent); }
    .icon-danger:hover { border-color: var(--danger); color: var(--danger); }

    .like-btn {
      display: inline-flex; align-items: center; gap: .32rem;
      padding: .3rem .6rem; border-radius: 999px;
      border: 1px solid var(--border); background: var(--card); font-size: .86rem; color: var(--text-muted);
    }
    .like-btn:hover { border-color: var(--accent); color: var(--accent); }
    .like-btn.liked { border-color: var(--accent); color: var(--accent-strong); background: var(--accent-soft); }

    /* ============================================================
       8. Markdown 正文与长文折叠
       ============================================================ */
    .md { font-size: .97rem; }
    .md h1, .md h2, .md h3, .md h4 { margin: 1.1em 0 .45em; }
    .md h1 { font-size: 1.25rem; }
    .md h2 { font-size: 1.15rem; }
    .md h3 { font-size: 1.05rem; }
    .md ul, .md ol { margin: 0 0 1em; padding-left: 1.4em; }
    .md li { margin-bottom: .2em; }
    .md code {
      background: var(--code-bg); color: var(--code-text);
      padding: .08em .35em; border-radius: 5px; font-size: .88em;
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    }
    .md pre {
      background: var(--code-bg); color: var(--code-text);
      border: 1px solid var(--border); border-radius: 10px;
      padding: .9rem 1rem; overflow-x: auto; margin: 0 0 1em;
    }
    .md pre code { background: transparent; padding: 0; font-size: .88rem; }

    /* 默认给可折叠正文一个上限高度，避免渲染后闪烁 */
    .body[data-collapsible] {
      max-height: 14rem; overflow: hidden; position: relative;
    }
    .body[data-collapsible]:not(.collapsed) { max-height: none; overflow: visible; }
    .body.collapsed::after {
      content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 3rem;
      background: linear-gradient(to bottom, transparent, var(--card)); pointer-events: none;
    }
    .expand-btn {
      margin-top: .5rem; padding: .25rem 0; font-size: .88rem; color: var(--accent);
      border: none; background: transparent; cursor: pointer;
    }
    .expand-btn:hover { text-decoration: underline; }

    /* ============================================================
       9. 分类筛选 chips
       ============================================================ */
    .filter-bar { display: flex; flex-wrap: wrap; gap: .45rem; margin-bottom: 1rem; }
    .chip {
      border: 1px solid var(--border); background: var(--card); color: var(--text-muted);
      padding: .28rem .75rem; border-radius: 999px; font-size: .85rem; cursor: pointer;
      transition: background .2s ease, border-color .2s ease, color .2s ease;
    }
    .chip:hover { border-color: var(--border-strong); color: var(--text); }
    .chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }

    /* ============================================================
       10. 关于页技能墙
       ============================================================ */
    .about-intro { margin-bottom: 2rem; }
    .about-subhead {
      font-size: 1.05rem; margin: 2rem 0 .75rem;
      letter-spacing: .01em;
    }
    .skill-head {
      display: flex; align-items: center; justify-content: space-between;
      gap: 1rem; margin: 2rem 0 .9rem;
    }
    .skill-head h3 { margin: 0; }
    .skill-flow { margin: .25rem 0 1rem; }
    .skill-group { margin-bottom: 1.1rem; }
    .skill-cat {
      display: block; font-size: .8rem; color: var(--text-muted);
      letter-spacing: .04em; margin-bottom: .6rem;
    }
    .skill-flow-list {
      list-style: none; margin: 0; padding: 0;
      display: flex; flex-wrap: wrap; gap: .5rem;
    }
    .skill-tag {
      display: inline-flex; align-items: center; gap: .4rem;
      border: 1px solid var(--border); border-radius: 999px;
      padding: .25rem .65rem; font-size: .86rem; background: var(--card);
    }
    .skill-tag.learned {
      border-color: var(--accent); color: var(--accent-strong);
      background: var(--accent-soft);
    }
    .skill-tag.planned { color: var(--text-muted); }
    .skill-name { font-weight: 600; }
    .skill-tag-status { font-size: .72rem; opacity: .7; }
    .skill-tag .item-actions { display: inline-flex; gap: .2rem; }
    .skill-tag .icon-btn { width: 1.5rem; height: 1.5rem; font-size: .76rem; border-radius: 999px; }
    .empty-mini { color: var(--text-muted); font-size: .88rem; margin: 0; }

    /* ============================================================
       11. 时间线（日志）
       ============================================================ */
    .timeline {
      list-style: none; margin: 0; padding: 0 0 0 1.35rem;
      border-left: 2px solid var(--border); margin-left: .35rem;
    }
    .timeline-item { position: relative; margin-bottom: 2.75rem; }
    .timeline-item::before {
      content: ""; position: absolute; left: -1.84rem; top: .55rem;
      width: .7rem; height: .7rem; border-radius: 50%;
      background: var(--accent); border: 3px solid var(--bg);
    }
    .log-entry { background: transparent; border: none; padding: 0; }
    .log-entry .card-title { font-size: clamp(1.25rem, 3vw, 1.6rem); }
    .log-date { font-weight: 700; color: var(--accent); }

    /* ============================================================
       12. 项目
       ============================================================ */
    .project-list { display: block; }
    .project-item { padding: 1.75rem 0; border-bottom: 1px solid var(--border); }
    .project-item:last-child { border-bottom: none; }
    .project-head { display: flex; align-items: flex-start; gap: 1rem; }
    .project-toggle {
      flex: 1; text-align: left; background: transparent; border: none;
      cursor: pointer; padding: 0; color: inherit; display: block;
    }
    .project-toggle:hover .project-title { color: var(--accent); }
    .project-title {
      display: block; font-family: var(--font-display);
      font-size: clamp(1.4rem, 4vw, 2rem); font-weight: 750;
      line-height: 1.2; letter-spacing: -.015em; margin: 0 0 .35rem;
    }
    .project-desc {
      display: block; color: var(--text-muted); font-size: .98rem;
      margin: 0; max-width: 34em; line-height: 1.6;
    }
    .project-item .item-actions { flex-shrink: 0; }
    .project-detail {
      margin-top: 1.15rem; padding-top: 1.15rem;
      border-top: 1px dashed var(--border);
    }
    .project-detail[hidden] { display: none; }
    .project-detail .tags { margin-bottom: .85rem; }
    .project-detail .md { margin-top: .35rem; }

    /* ============================================================
       13. 联系
       ============================================================ */
    .contact-list { display: grid; gap: 0; margin-bottom: 1.5rem; }
    .contact-item {
      display: flex; align-items: center; gap: .7rem; flex-wrap: wrap;
      padding: .85rem 0; border-bottom: 1px solid var(--border);
    }
    .contact-item:first-child { border-top: 1px solid var(--border); }
    .contact-label { color: var(--text-muted); font-size: .86rem; min-width: 3.5rem; }
    .contact-value { font-weight: 600; overflow-wrap: anywhere; }
    .contact-item .btn { margin-left: auto; }
    .contact-hint { color: var(--text-muted); font-size: .92rem; }

    /* ============================================================
       14. 设置
       ============================================================ */
    .settings-grid { display: grid; gap: 1rem; }
    .setting-card {
      border: 1px solid var(--border); background: var(--card);
      border-radius: 12px; padding: 1.1rem 1.15rem;
    }
    .setting-card h3 { font-size: 1.02rem; margin-bottom: .75rem; }
    .setting-row { display: block; font-size: .88rem; color: var(--text-muted); margin-bottom: .3rem; }
    .select {
      width: 100%; max-width: 14rem; padding: .5rem .7rem; font-size: .95rem;
      border: 1px solid var(--border); border-radius: 10px; background: var(--card); color: var(--text);
    }
    .setting-hint { color: var(--text-muted); font-size: .84rem; margin-top: .7rem; margin-bottom: 0; }
    .sync-status { font-size: .88rem; color: var(--text-muted); margin: 0 0 .75rem; }
    .sync-status.ok { color: var(--accent); }
    .sync-status.err { color: var(--danger); }

       15. 模态框与确认框
       ============================================================ */
    .modal-overlay {
      position: fixed; inset: 0; z-index: 200;
      background: rgba(10, 12, 18, .5);
      display: flex; align-items: flex-start; justify-content: center;
      padding: 4vh 1rem 1rem; overflow-y: auto;
    }
    .modal {
      background: var(--bg-elevated); border: 1px solid var(--border);
      border-radius: 12px; width: 100%; max-width: 560px; box-shadow: var(--shadow);
    }
    .modal-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 1rem 1.15rem; border-bottom: 1px solid var(--border);
    }
    .modal-title { font-size: 1.05rem; margin: 0; }
    .modal-close {
      border: none; background: transparent; font-size: 1.5rem; line-height: 1;
      cursor: pointer; color: var(--text-muted); padding: 0 .2rem;
    }
    .modal-close:hover { color: var(--text); }
    .modal-body { padding: 1.15rem; }
    .modal-actions {
      display: flex; justify-content: flex-end; gap: .6rem; margin-top: 1.25rem;
    }
    .field { display: block; margin-bottom: .9rem; }
    .field > span { display: block; font-size: .86rem; color: var(--text-muted); margin-bottom: .3rem; }
    .field input, .field textarea, .field select {
      width: 100%; padding: .55rem .7rem; font-size: .95rem; font-family: inherit;
      border: 1px solid var(--border); border-radius: 10px; background: var(--card); color: var(--text);
    }
    .field textarea { resize: vertical; line-height: 1.6; }
    .confirm-message { margin: 0 0 .25rem; }

    body.modal-open { overflow: hidden; }

    /* ============================================================
       16. 回到顶部、Toast、页脚
       ============================================================ */
    .back-to-top {
      position: fixed; right: 1rem; bottom: 1rem; z-index: 60;
      width: 2.6rem; height: 2.6rem; border-radius: 50%;
      border: 1px solid var(--border); background: var(--card); color: var(--text);
      box-shadow: var(--shadow); cursor: pointer; opacity: 0; pointer-events: none;
      transform: translateY(8px); transition: opacity .2s, transform .2s;
      font-size: 1.1rem;
    }
    .back-to-top.visible { opacity: 1; pointer-events: auto; transform: translateY(0); }
    .back-to-top:hover { border-color: var(--accent); color: var(--accent); }

    .toast {
      position: fixed; left: 50%; bottom: 1.5rem; transform: translateX(-50%) translateY(8px);
      background: var(--text); color: var(--bg); padding: .55rem 1rem; border-radius: 8px;
      font-size: .9rem; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
      z-index: 300; max-width: 90vw;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    .site-footer {
      border-top: 1px solid var(--border); padding: 1.5rem 0 2.5rem;
      color: var(--text-muted); font-size: .86rem; text-align: center;
    }

    /* ===== 第二阶段新增：统计 / 路线图 / 阶段徽章 / 列表式笔记 / 搜索 / 加载 / 表格 ===== */

    }

    .roadmap-item.current .roadmap-fill { background: var(--amber); }

    .stage-badge {
      background: var(--code-bg); color: var(--text-muted); border: 1px solid var(--border);
      font-size: .74rem; padding: .04rem .5rem; border-radius: 999px; font-weight: 500;
    }

    .note-list { display: block; }
    .note-item {
      background: transparent; box-shadow: none; border: none;
      border-bottom: 1px solid var(--border); border-radius: 0; padding: 1.75rem 0;
    }
    .note-item:last-child { border-bottom: none; }
    .note-item .card-title { font-size: clamp(1.35rem, 3.5vw, 1.75rem); line-height: 1.25; }
    .note-item .card-meta { font-size: .8rem; }
    .note-item .body.collapsed::after { background: linear-gradient(to bottom, transparent, var(--bg)); }

    .search-meta { font-size: .82rem; color: var(--text-muted); margin-top: .45rem; min-height: 1.2em; }
    .clear-search { border: none; background: none; color: var(--accent); cursor: pointer; padding: 0; font-size: inherit; text-decoration: underline; }

    .loader-bar { position: fixed; top: 0; left: 0; right: 0; height: 3px; z-index: 120; overflow: hidden; }
    .loader-bar::before {
      content: ""; position: absolute; top: 0; bottom: 0; left: -40%; width: 40%;
      background: var(--accent); animation: loadslide 1s ease-in-out infinite;
    }
    .loader-bar[hidden] { display: none; }
    @keyframes loadslide { 0% { left: -40%; } 100% { left: 100%; } }

    /* 滚动 reveal（纯 CSS 过渡 + IntersectionObserver，不引入 GSAP） */
    .reveal { opacity: 0; transform: translateY(20px); transition: opacity .7s ease, transform .7s ease; }
    .reveal.in { opacity: 1; transform: none; }

    .banner {
      display: flex; align-items: center; gap: .6rem;
      padding: .55rem 1rem; background: var(--danger-soft); color: var(--danger);
      border-bottom: 1px solid var(--border); font-size: .88rem;
    }
    .banner .banner-close { margin-left: auto; border: none; background: none; color: inherit; cursor: pointer; font-size: 1rem; }

    .sync-dot {

    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .back-to-top, .toast { transition: none; }
      .reveal { opacity: 1; transform: none; transition: none; }
      .loader-bar::before { animation: none; }
    }

</head>

    /* ---------------- 轻量 Markdown 渲染 ----------------
       流程：先整体转义（防 XSS）→ 提取代码块占位 → 解析块 →
             行内解析（行内代码、链接、粗体、斜体）。
       只支持一个安全子集，足够写技术笔记。 */
    function renderMarkdown(src) {
      if (src == null) return "";
      var text = esc(String(src));
      var codeBlocks = [];

      text = text.replace(/```[^\n`]*\n?([\s\S]*?)```/g, function (m, code) {
        codeBlocks.push(code.replace(/\n$/, ""));
        return "\u0000B" + (codeBlocks.length - 1) + "\u0000";
      });

      var blocks = text.split(/\n{2,}/).map(function (b) { return b.trim(); }).filter(Boolean);
      return blocks.map(function (block) { return renderBlock(block, codeBlocks); }).join("");
    }

    function renderBlock(block, codeBlocks) {
      var cb = block.match(/^\u0000B(\d+)\u0000$/);
      if (cb) return "<pre><code>" + codeBlocks[+cb[1]] + "</code></pre>";

      var heading = block.match(/^(#{1,6})\s+(.*)$/);
      if (heading) {
        var level = heading[1].length;
        return "<h" + level + ">" + renderInline(heading[2], codeBlocks) + "</h" + level + ">";
      }

      // 表格：至少两行，第二行为分隔行（由 |、-、: 组成）
      var lines = block.split("\n");
      if (lines.length >= 2 && lines[0].indexOf("|") >= 0 &&
          /^\s*\|?[\s:|-]+\|?\s*$/.test(lines[1]) && lines[1].indexOf("-") >= 0) {
        return renderTable(lines, codeBlocks);
      }

      // 任务列表
      if (/^[-*+]\s+\[[ xX]\]\s+/.test(block)) {
        return "<ul class='task-list'>" + block.split(/\n/).filter(function (l) {
          return /^[-*+]\s+\[[ xX]\]\s+/.test(l);
        }).map(function (l) {
          var checked = /^[-*+]\s+\[[xX]\]/.test(l);
          var txt = l.replace(/^[-*+]\s+\[[ xX]\]\s+/, "");
          return '<li class="task"><input type="checkbox" disabled' + (checked ? " checked" : "") + "> " + renderInline(txt, codeBlocks) + "</li>";
        }).join("") + "</ul>";
      }

      if (/^[-*+]\s+/.test(block)) {
        var items = block.split(/\n/).filter(function (l) { return /^[-*+]\s+/.test(l); })
          .map(function (l) { return l.replace(/^[-*+]\s+/, ""); });
        return "<ul>" + items.map(function (it) {
          return "<li>" + renderInline(it, codeBlocks) + "</li>";
        }).join("") + "</ul>";
      }

      if (/^\d+[.)]\s+/.test(block)) {
        var ordered = block.split(/\n/).filter(function (l) { return /^\d+[.)]\s+/.test(l); })
          .map(function (l) { return l.replace(/^\d+[.)]\s+/, ""); });
        return "<ol>" + ordered.map(function (it) {
          return "<li>" + renderInline(it, codeBlocks) + "</li>";
        }).join("") + "</ol>";
      }

      return "<p>" + renderInline(block, codeBlocks) + "</p>";
    }

    function renderTable(lines, codeBlocks) {
      function cells(l) {
        return l.replace(/^\s*\|/, "").replace(/\|\s*$/, "").split("|").map(function (c) { return c.trim(); });
      }
      var header = cells(lines[0]);
      var html = "<table><thead><tr>" + header.map(function (c) {
        return "<th>" + renderInline(c, codeBlocks) + "</th>";
      }).join("") + "</tr></thead><tbody>";
      for (var i = 2; i < lines.length; i++) {
        if (lines[i].trim().indexOf("|") < 0) continue;
        var row = cells(lines[i]);
        html += "<tr>" + row.map(function (c) {
          return "<td>" + renderInline(c, codeBlocks) + "</td>";
        }).join("") + "</tr>";
      }
      return html + "</tbody></table>";
    }

    function renderInline(text, codeBlocks) {
      var t = text;
      var spans = [];

      t = t.replace(/`([^`]+)`/g, function (m, code) {
        spans.push(code);
        return "\u0000S" + (spans.length - 1) + "\u0000";
      });

      t = t.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function (m, label, url) {
        var safe = safeUrl(url);
        return safe
          ? '<a href="' + safe + '" target="_blank" rel="noopener noreferrer">' + label + "</a>"
          : label;
      });

      t = t.replace(/~~([^~]+)~~/g, "<del>$1</del>");
      t = t.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      t = t.replace(/__([^_]+)__/g, "<strong>$1</strong>");
      t = t.replace(/(^|[^*])\*([^*]+)\*(?!\*)/g, "$1<em>$2</em>");
      t = t.replace(/(^|[^_])_([^_]+)_(?!_)/g, "$1<em>$2</em>");

      t = t.replace(/\u0000S(\d+)\u0000/g, function (m, i) {
        return "<code>" + spans[+i] + "</code>";
      });
      t = t.replace(/\u0000B(\d+)\u0000/g, function (m, i) {
        return "<pre><code>" + codeBlocks[+i] + "</code></pre>";
      });
      t = t.replace(/\n/g, "<br>");

      return t;
    }

    function readPat() {

    // 带超时的 fetch：避免网络不通时首屏一直卡在加载态
    function fetchWithTimeout(url, options, ms) {
      var controller = new AbortController();
      var timer = setTimeout(function () { controller.abort(); }, ms || 8000);
      var opts = options || {};
      opts.signal = controller.signal;
      return fetch(url, opts).then(function (res) {
        clearTimeout(timer);
        return res;
      }, function (err) {
        clearTimeout(timer);
        throw err;
      });
    }

    function encodeBase64(str) {
      var bytes = new TextEncoder().encode(str);
      var bin = "";
      for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
      return btoa(bin);
    }

    function decodeBase64(b64) {
      var bin = atob(String(b64).replace(/\s/g, ""));
      var bytes = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return new TextDecoder("utf-8").decode(bytes);
    }

    async function ghValidate() {
      auth.connected = false;
      auth.error = null;
      var url = "https://api.github.com/repos/" + encodeURIComponent(syncConfig.owner) + "/" + encodeURIComponent(syncConfig.repo);
      try {
        var res = await fetchWithTimeout(url, { headers: ghHeaders() });
        if (res.ok) { auth.connected = true; return true; }
        if (res.status === 404) auth.error = "仓库不存在，或 Token 没有该仓库权限";
        else if (res.status === 401) auth.error = "Token 无效";
        else auth.error = "连接失败（HTTP " + res.status + "）";
      } catch (e) {
        auth.error = "网络错误";
      }
      return false;

        : "https://raw.githubusercontent.com/" + encodeURIComponent(syncConfig.owner) + "/" + encodeURIComponent(syncConfig.repo) + "/" + encodeURIComponent(syncConfig.branch) + "/" + encodeURIComponent(syncConfig.path);
      var res = await fetchWithTimeout(url, useApi ? { headers: ghHeaders() } : {});
      if (res.status === 404) return null; // 云端还没有 data.json

        auth.sha = j.sha;
        return JSON.parse(decodeBase64(j.content));
      }
      return res.json();

      var url = "https://api.github.com/repos/" + encodeURIComponent(syncConfig.owner) + "/" + encodeURIComponent(syncConfig.repo) + "/contents/" + encodeURIComponent(syncConfig.path);

        await fetchCloudData();
        body.sha = auth.sha;
        res = await fetchWithTimeout(url, { method: "PUT", headers: ghHeaders(), body: JSON.stringify(body) });

      if (!res.ok) throw new Error("HTTP " + res.status);
      var j = await res.json();
      if (j && j.content && j.content.sha) auth.sha = j.content.sha;

        if (type === "skill") {
          out.name = String(item.name || "");
          out.category = SKILL_CATEGORIES.indexOf(item.category) >= 0 ? item.category : "其他";
          out.status = item.status === "planned" ? "planned" : "learned";
        } else if (type === "note") {
          out.date = String(item.date || "");
          out.category = String(item.category || "其他");
          out.title = String(item.title || "");
          out.summary = String(item.summary || "");
          out.body = String(item.body || "");
          out.tags = Array.isArray(item.tags) ? item.tags.map(String) : [];
          out.link = String(item.link || "");
          out.stage = STAGES.indexOf(item.stage) >= 0 ? item.stage : "";
        } else if (type === "log") {
          out.date = String(item.date || "");
          out.title = String(item.title || "");
          out.summary = String(item.summary || "");
          out.body = String(item.body || "");
        } else if (type === "project") {
          out.name = String(item.name || "");
          out.desc = String(item.desc || "");
          out.tags = Array.isArray(item.tags) ? item.tags.map(String) : [];
          out.link = String(item.link || "");
          out.detail = String(item.detail || "");
        }
        return out;
      };
    }

    function mergeData(base, incoming) {
      var out = deepClone(base);
      if (!incoming || typeof incoming !== "object") return out;
      if (incoming.meta && typeof incoming.meta === "object") out.meta = Object.assign({}, out.meta, incoming.meta);
      if (incoming.about && typeof incoming.about === "object") out.about = Object.assign({}, out.about, incoming.about);
      ["skills", "notes", "logs", "projects"].forEach(function (key) {
        if (!Array.isArray(incoming[key])) return;
        var map = new Map();
        out[key].forEach(function (x) { map.set(x.id, x); });
        incoming[key].forEach(function (x) {
          if (!x || !x.id) return;
          map.set(x.id, Object.assign({}, map.get(x.id) || {}, x));
        });
        out[key] = Array.from(map.values());
      });
      return sanitizeData(out);
    }

    /* ---------------- 数据查询辅助 ---------------- */
    function getList(type) {
      if (type === "note") return data.notes;
      if (type === "log") return data.logs;
      if (type === "project") return data.projects;
      if (type === "skill") return data.skills;
      return [];
    }

    function matchesSearch(item, q) {
      var fields = ["title", "summary", "body", "category", "name", "desc", "detail"];
      return fields.some(function (f) {
        return String(item[f] || "").toLowerCase().indexOf(q) >= 0;
      }) || (Array.isArray(item.tags) && item.tags.some(function (t) {
        return String(t).toLowerCase().indexOf(q) >= 0;
      }));
    }

    /* ---------------- 统计 / 高亮 / 路线图 ---------------- */
    function computeStats() {
      var dates = {};
      data.notes.concat(data.logs).forEach(function (x) {
        if (x.date) dates[x.date] = true;
      });
      var keys = Object.keys(dates).sort();
      var streak = 0, best = 0;
      for (var i = 0; i < keys.length; i++) {
        if (i === 0) {
          streak = 1;
        } else {
          var diff = Math.round((new Date(keys[i]) - new Date(keys[i - 1])) / 86400000);
          streak = diff === 1 ? streak + 1 : 1;
        }
        if (streak > best) best = streak;
      }
      var learned = data.skills.filter(function (s) { return s.status === "learned"; }).length;
      var currentStage = "";
      var latest = null;
      data.notes.forEach(function (n) {
        if (n.date && (!latest || n.date > latest.date)) latest = { date: n.date, stage: n.stage };
      });
      if (latest && STAGES.indexOf(latest.stage) >= 0) currentStage = latest.stage;
      return {
        notes: data.notes.length,
        logs: data.logs.length,
        projects: data.projects.length,
        streak: best,
        learned: learned,
        currentStage: currentStage
      };
    }

    function highlight(text, query) {
      var safe = esc(text);
      var q = String(query || "").trim();
      if (!q) return safe;
      var idx = safe.toLowerCase().indexOf(q.toLowerCase());
      if (idx < 0) return safe;
      return safe.slice(0, idx) + "<mark>" + safe.slice(idx, idx + q.length) + "</mark>" + safe.slice(idx + q.length);
    }

    function updateSearchMeta() {
      var el = document.getElementById("search-meta");
      if (!el) return;
      var q = ui.search.trim();
      if (!q) { el.innerHTML = ""; return; }
      var lq = q.toLowerCase();
      var n = data.notes.filter(function (x) { return matchesSearch(x, lq); }).length;
      var l = data.logs.filter(function (x) { return matchesSearch(x, lq); }).length;
      var p = data.projects.filter(function (x) { return matchesSearch(x, lq); }).length;
      var total = n + l + p;
      el.innerHTML = total
        ? "共 " + total + " 条结果 · 笔记 " + n + " · 日志 " + l + " · 项目 " + p
        : '没有找到结果，<button type="button" class="clear-search" data-action="clear-search">清除搜索</button>';
    }

    function renderRoadmap() {
      var counts = {};
      STAGES.forEach(function (s) { counts[s] = 0; });
      var latest = null;
      data.notes.forEach(function (n) {
        if (counts[n.stage] !== undefined) counts[n.stage]++;
        if (n.date && (!latest || n.date > latest.date)) latest = { date: n.date, stage: n.stage };
      });
      var max = Math.max.apply(null, STAGES.map(function (s) { return counts[s]; })) || 1;
      var current = (latest && counts[latest.stage] !== undefined) ? latest.stage : "";
      return '<div class="roadmap">' + STAGES.map(function (s) {
        var pct = counts[s] ? Math.max(8, Math.round(counts[s] / max * 100)) : 0;
        return '<div class="roadmap-item' + (s === current ? " current" : "") + '">' +
          '<span class="roadmap-name">' + esc(s) + "</span>" +
          '<div class="roadmap-bar"><div class="roadmap-fill" style="width:' + pct + '%"></div></div>' +
          '<span class="roadmap-count">' + counts[s] + " 篇</span>" +
        "</div>";
      }).join("") + "</div>";
    }

      renderNotes();
      renderLogs();
      renderProjects();
      renderContact();
    }

    /* ---------------- 长文展开 / 折叠 ---------------- */
    function applyCollapse(root) {
      root.querySelectorAll(".body[data-collapsible]").forEach(function (body) {
        var id = body.getAttribute("data-id");
        var btn = null;
        root.querySelectorAll(".expand-btn").forEach(function (b) {
          if (b.getAttribute("data-id") === id) btn = b;
        });
        if (!btn) return;
        var overflowing = body.scrollHeight > body.clientHeight + 8;
        if (overflowing) {
          btn.hidden = false;
          if (ui.expanded[id]) {
            body.classList.remove("collapsed");
            btn.textContent = "收起";
          } else {
            body.classList.add("collapsed");
            btn.textContent = "展开全文";
          }
        } else {
          body.classList.remove("collapsed");
          btn.hidden = true;
        }
      });
    }

    /* ---------------- 模态框 ---------------- */
    var modalRoot = document.getElementById("modal-root");

    function openModal(innerHtml, opts) {
      lastFocused = document.activeElement;
      modalRoot.innerHTML =
        '<div class="modal-overlay" data-modal-overlay>' +
          '<div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">' +
            '<div class="modal-head">' +
              '<h2 class="modal-title" id="modal-title">' + esc(opts.title || "") + "</h2>" +
              '<button type="button" class="modal-close" data-action="modal-cancel" aria-label="关闭">×</button>' +
            "</div>" +
            '<div class="modal-body">' + innerHtml + "</div>" +
          "</div>" +
        "</div>";
      document.body.classList.add("modal-open");
      var first = modalRoot.querySelector("input, select, textarea, button:not([data-action='modal-cancel'])");
      if (first) first.focus();
    }

    function closeModal() {
      modalRoot.innerHTML = "";
      document.body.classList.remove("modal-open");
      if (lastFocused && document.contains(lastFocused)) lastFocused.focus();
    }

    function openConfirm(opts) {
      pendingConfirm = opts.onConfirm;
      openModal(
        '<p class="confirm-message">' + esc(opts.message) + "</p>" +
        '<div class="modal-actions">' +
          '<button type="button" class="btn" data-action="confirm-no">取消</button>' +
          '<button type="button" class="btn btn-danger" data-action="confirm-yes">' + esc(opts.confirmLabel || "确认") + "</button>" +
        "</div>",
        { title: opts.title || "确认" }
      );
    }

    /* ---------------- 表单模态框 ---------------- */

      note: {
        label: "笔记",
        fields: [
          { key: "date", label: "日期", type: "date", required: true, default: today() },
          { key: "category", label: "分类", type: "text", required: true, list: "note-categories", default: "", placeholder: "如：C 语言 / Verilog" },
          { key: "stage", label: "阶段（一生一芯）", type: "select", default: "",
            options: [{ value: "", label: "未分类" }].concat(STAGES.map(function (s) { return { value: s, label: s }; })) },
          { key: "title", label: "标题", type: "text", required: true, default: "" },
          { key: "summary", label: "摘要", type: "textarea", rows: 2, default: "" },
          { key: "body", label: "正文（支持 Markdown）", type: "textarea", rows: 10, default: "" },

        ]

      log: {
        label: "日志",

          { key: "date", label: "日期", type: "date", required: true, default: today() },

      }
    };

    function openFormModal(type, id) {
      var def = FORM_DEFS[type];
      var editing = !!id;
      var item;
      if (type === "about") {
        item = data.about;
      } else {
        var list = getList(type);
        item = editing ? list.find(function (x) { return x.id === id; }) : null;
      }

      var fieldsHtml = def.fields.map(function (f) {
        var val = item ? item[f.key] : f.default;
        if ((f.key === "tags" || f.key === "focus") && Array.isArray(val)) {
          val = f.key === "focus" ? val.join("\n") : val.join(", ");
        }
        var value = val == null ? "" : String(val);
        var name = 'name="' + f.key + '"';
        if (f.type === "textarea") {
          return '<label class="field"><span>' + f.label + "</span><textarea " + name + ' rows="' + (f.rows || 6) + '">' + esc(value) + "</textarea></label>";
        }
        if (f.type === "select") {
          return '<label class="field"><span>' + f.label + "</span><select " + name + ">" +
            f.options.map(function (o) {
              return '<option value="' + esc(o.value) + '"' + (o.value === value ? " selected" : "") + ">" + esc(o.label) + "</option>";
            }).join("") + "</select></label>";
        }
        var attrs = ' type="' + f.type + '" ' + name + ' value="' + esc(value) + '"';
        if (f.required) attrs += " required";
        if (f.list) attrs += ' list="' + f.list + '"';
        if (f.placeholder) attrs += ' placeholder="' + esc(f.placeholder) + '"';
        return '<label class="field"><span>' + f.label + "</span><input" + attrs + "></label>";
      }).join("");

      openModal(
        '<form id="item-form" data-form-type="' + type + '"' + (editing ? ' data-id="' + esc(id) + '"' : "") + ">" +
          fieldsHtml +
          '<div class="modal-actions">' +
            '<button type="button" class="btn" data-action="modal-cancel">取消</button>' +
            '<button type="submit" class="btn btn-primary">保存</button>' +
          "</div>" +
        "</form>",
        { title: (editing ? "编辑" : "添加") + def.label }
      );
    }

    function handleFormSubmit(form) {
      var type = form.getAttribute("data-form-type");
      var editingId = form.getAttribute("data-id");
      if (!requireAuth()) return;
      var fd = new FormData(form);
      var values = {};
      FORM_DEFS[type].fields.forEach(function (f) { values[f.key] = fd.get(f.key) || ""; });

      if (type === "about") {
        data.about.intro = String(values.intro || "");
        data.about.why = String(values.why || "");
        data.about.focus = String(values.focus || "").split("\n").map(function (s) { return s.trim(); }).filter(Boolean);
      } else if (type === "skill") {
        var skill = {
          id: editingId || uid("skill"),
          name: String(values.name || "").trim(),
          category: values.category,
          status: values.status
        };
        upsert("skills", skill, editingId);
      } else {
        var list = getList(type);
        var existing = editingId ? list.find(function (x) { return x.id === editingId; }) : null;
        var obj = existing || { id: uid(type === "project" ? "proj" : type), likes: 0, liked: false };
        if (type === "note") {
          Object.assign(obj, {
            date: String(values.date || ""),
            category: String(values.category || "").trim() || "其他",
            title: String(values.title || "").trim(),
            summary: String(values.summary || ""),
            body: String(values.body || ""),
            tags: splitTags(values.tags),
            link: String(values.link || "").trim(),
            stage: STAGES.indexOf(values.stage) >= 0 ? values.stage : ""
          });
        } else if (type === "log") {
          Object.assign(obj, {
            date: String(values.date || ""),
            title: String(values.title || "").trim(),
            summary: String(values.summary || ""),
            body: String(values.body || "")
          });
        } else if (type === "project") {
          Object.assign(obj, {
            name: String(values.name || "").trim(),
            desc: String(values.desc || "").trim(),
            tags: splitTags(values.tags),
            link: String(values.link || "").trim(),
            detail: String(values.detail || "")
          });
        }
        upsert(getListName(type), obj, editingId);
      }

      persistData();
      renderAll();
      closeModal();
      showToast("已保存");
    }

    function getListName(type) {
      return type === "note" ? "notes" : type === "log" ? "logs" : "projects";
    }

    function upsert(listName, obj, editingId) {
      var list = data[listName];
      if (editingId) {
        var i = list.findIndex(function (x) { return x.id === editingId; });
        if (i >= 0) list[i] = obj;
        else list.push(obj);
      } else {
        list.unshift(obj);
      }
    }

    /* ---------------- 删除 ---------------- */
    function handleDelete(type, id) {
      if (!requireAuth()) return;
      var list = getList(type);
      var item = list.find(function (x) { return x.id === id; });
      var name = (item && (item.title || item.name)) || "这条内容";
      openConfirm({
        title: "确认删除",
        message: "确定要删除「" + name + "」吗？删除后无法撤销。",
        confirmLabel: "删除",
        onConfirm: function () {
          var i = list.findIndex(function (x) { return x.id === id; });
          if (i >= 0) list.splice(i, 1);
          persistData();
          renderAll();
          showToast("已删除");
        }
      });
    }

    /* ---------------- 项目详情 ---------------- */
    function openDetail(id) {
      var detail = null, toggle = null;
      document.querySelectorAll(".project-detail").forEach(function (d) {
        if (d.getAttribute("data-id") === id) detail = d;
      });
      document.querySelectorAll(".project-toggle").forEach(function (t) {
        if (t.getAttribute("data-id") === id) toggle = t;
      });
      if (!detail) return;
      var willOpen = detail.hidden;
      detail.hidden = !willOpen;
      if (toggle) toggle.setAttribute("aria-expanded", String(willOpen));
    }

    /* ---------------- 点赞 ---------------- */
    function handleLike(type, id) {
      if (!requireAuth()) return;
      var item = getList(type).find(function (x) { return x.id === id; });
      if (!item) return;
      if (item.liked) {
        item.liked = false;
        item.likes = Math.max(0, (item.likes || 0) - 1);
      } else {
        item.liked = true;
        item.likes = (item.likes || 0) + 1;
      }
      persistData();
      if (type === "note") renderNotes();
      else if (type === "log") renderLogs();
      else if (type === "project") renderProjects();
    }

    /* ---------------- 数据导入 / 导出 ---------------- */
    function downloadText(text, filename, type) {
      var blob = new Blob([text], { type: type + ";charset=utf-8" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    }

    function exportJSON() {
      downloadText(JSON.stringify(data, null, 2), "ysyx-portfolio.json", "application/json");
      showToast("已导出 JSON");
    }

    function clearFilters() {
      ui.search = "";
      ui.noteCategory = "全部";
      ui.noteStage = "全部";
      document.getElementById("search-input").value = "";
      updateSearchMeta();
    }

    function resetData() {
      if (!requireAuth()) return;
      openConfirm({
        title: "重置默认数据",
        message: "确定要清空所有修改并恢复初始占位内容吗？此操作无法撤销。",
        confirmLabel: "重置",
        onConfirm: function () {
          data = deepClone(DEFAULT_DATA);
          clearFilters();
          persistData();
          renderAll();
          showToast("已恢复默认数据");

      });

    /* ---------------- 复制邮箱 ---------------- */
    function copyEmail() {
      var email = getEmail();
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(email).then(
          function () { showToast("邮箱已复制"); },
          function () { fallbackCopy(email); }
        );
      } else {
        fallbackCopy(email);
      }
    }

    function fallbackCopy(text) {
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.setAttribute("readonly", "");
      ta.style.position = "fixed";
      ta.style.left = "-9999px";
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand("copy"); showToast("邮箱已复制"); }
      catch (e) { showToast("复制失败，请手动选择复制"); }
      ta.remove();
    }

    /* ---------------- 主题 ---------------- */
    function getThemePref() {
      try { return localStorage.getItem(THEME_KEY) || "auto"; } catch (e) { return "auto"; }
    }

    function effectiveTheme(pref) {
      if (pref === "dark") return "dark";
      if (pref === "light") return "light";
      return (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
    }

    function setThemePref(pref) {
      try { localStorage.setItem(THEME_KEY, pref); } catch (e) {}
      applyTheme();
    }

    function applyTheme() {
      var pref = getThemePref();
      var effective = effectiveTheme(pref);
      document.documentElement.setAttribute("data-theme", effective);
      var toggle = document.getElementById("theme-toggle");
      if (toggle) {
        var isDark = effective === "dark";
        toggle.textContent = isDark ? "☀" : "☾";
        toggle.setAttribute("aria-label", isDark ? "切换到亮色模式" : "切换到暗色模式");
        toggle.setAttribute("title", isDark ? "切换到亮色模式" : "切换到暗色模式");
      }
      var select = document.getElementById("theme-select");
      if (select) select.value = pref;
    }

    function toggleTheme() {
      setThemePref(effectiveTheme(getThemePref()) === "dark" ? "light" : "dark");
    }

    /* ---------------- 编辑模式 ---------------- */
    function toggleEditMode() {
      if (!requireAuth()) return;
      var on = document.body.classList.toggle("edit-mode");
      var btn = document.getElementById("edit-toggle");
      if (btn) {
        btn.textContent = on ? "完成" : "编辑模式";
        btn.setAttribute("aria-pressed", String(on));
      }
      showToast(on ? "编辑模式已开启" : "编辑模式已关闭");
    }

    /* ---------------- Toast ---------------- */
    var toastTimer = null;
    function showToast(msg) {
      var toast = document.getElementById("toast");
      toast.textContent = msg;
      toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { toast.classList.remove("show"); }, 2200);
    }

    function showBanner(msg, type) {
      var banner = document.getElementById("banner");
      var text = document.getElementById("banner-text");
      if (!banner || !text) { showToast(msg); return; }
      text.textContent = msg;
      banner.className = "banner" + (type === "err" ? " err" : "");
      banner.hidden = false;
    }

    /* ---------------- 事件绑定 ---------------- */
    var searchInput = document.getElementById("search-input");
    var importInput = document.getElementById("import-file");
    var backToTop = document.getElementById("back-to-top");
    var navToggle = document.getElementById("nav-toggle");
    var siteNav = document.getElementById("site-nav");
    var navList = document.getElementById("nav-list");

    // 统一的点击委托：处理所有 data-action 按钮
    document.addEventListener("click", function (e) {
      var btn = e.target.closest ? e.target.closest("[data-action]") : null;
      if (!btn) return;
      var action = btn.getAttribute("data-action");
      var type = btn.getAttribute("data-type");
      var id = btn.getAttribute("data-id");

      switch (action) {
        case "theme": toggleTheme(); break;
        case "edit-mode": toggleEditMode(); break;
        case "like": handleLike(type, id); break;
        case "expand":
          ui.expanded[id] = !ui.expanded[id];
          applyCollapse(document);
          break;
        case "edit": openFormModal(type, id); break;
        case "add": openFormModal(type, null); break;
        case "edit-about": openFormModal("about", null); break;
        case "delete": handleDelete(type, id); break;
        case "detail": openDetail(id); break;
        case "filter":
          ui.noteCategory = btn.getAttribute("data-category");
          renderNotes();
          break;
        case "stage-filter":
          ui.noteStage = btn.getAttribute("data-stage");
          renderNotes();
          break;
        case "clear-search":
          searchInput.value = "";
          ui.search = "";
          renderNotes();
          renderLogs();
          renderProjects();
          updateSearchMeta();
          break;
        case "banner-close":
          document.getElementById("banner").hidden = true;
          break;
        case "copy-email": copyEmail(); break;
        case "mailto": window.location.href = "mailto:" + getEmail(); break;
        case "export-json": exportJSON(); break;
        case "import-json":
          pendingImportMode = btn.getAttribute("data-mode") || "merge";
          importInput.click();
          break;
        case "export-md": exportMarkdown(); break;
        case "reset-data": resetData(); break;
        case "sync-connect": connectGitHub(); break;
        case "sync-pull": pullCloud(); break;
        case "sync-push": syncNow(); break;
        case "sync-disconnect": disconnect(); break;
        case "confirm-yes": {
          var cb = pendingConfirm;
          pendingConfirm = null;
          closeModal();
          if (cb) cb();
          break;
        }
        case "confirm-no":
        case "modal-cancel":
          pendingConfirm = null;
          closeModal();
          break;
        default: break;
      }
    });

    // 表单提交（模态框内的 #item-form）
    document.addEventListener("submit", function (e) {
      if (e.target && e.target.id === "item-form") {
        e.preventDefault();
        handleFormSubmit(e.target);
      }
    });

    // 主题下拉、文件导入的 change 事件
    document.addEventListener("change", function (e) {
      if (e.target && e.target.id === "theme-select") {
        setThemePref(e.target.value);
      } else if (e.target && e.target.id === "import-file") {
        handleImportFile(e.target);
      }
    });

    function handleImportFile(input) {
      if (!requireAuth()) { input.value = ""; return; }
      var file = input.files && input.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function () {
        try {
          var parsed = JSON.parse(String(reader.result));
          if (pendingImportMode === "overwrite") {
            data = sanitizeData(parsed);
          } else {
            data = mergeData(data, sanitizeData(parsed));
          }
          persistData();
          clearFilters();
          renderAll();
          showToast("导入成功");
        } catch (err) {
          showToast("导入失败：文件不是有效的 JSON");
        }
      };
      reader.readAsText(file);
      input.value = "";
    }

    // ESC 关闭模态框，并在模态框内做焦点圈定
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && modalRoot.querySelector(".modal")) {
        pendingConfirm = null;
        closeModal();
        return;
      }
      if (e.key === "Tab" && modalRoot.querySelector(".modal")) {
        var focusables = Array.prototype.slice.call(
          modalRoot.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])')
        ).filter(function (el) { return !el.disabled; });
        if (!focusables.length) return;
        var first = focusables[0];
        var last = focusables[focusables.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      }
    });

    // 点击遮罩关闭模态框
    modalRoot.addEventListener("click", function (e) {
      if (e.target && e.target.hasAttribute && e.target.hasAttribute("data-modal-overlay")) {
        pendingConfirm = null;
        closeModal();
      }
    });

    // 搜索框实时过滤（带防抖）
    searchInput.addEventListener("input", function () {
      if (searchTimer) clearTimeout(searchTimer);
      searchTimer = setTimeout(function () {
        ui.search = searchInput.value;
        renderNotes();
        renderLogs();
        renderProjects();
        updateSearchMeta();
      }, 200);
    });

    // 移动端汉堡菜单
    navToggle.addEventListener("click", function () {
      var open = siteNav.classList.toggle("open");
      navToggle.setAttribute("aria-expanded", String(open));
    });
    navList.addEventListener("click", function (e) {
      if (e.target.closest && e.target.closest("a")) {
        siteNav.classList.remove("open");
        navToggle.setAttribute("aria-expanded", "false");
      }
    });

    // 回到顶部
    backToTop.addEventListener("click", function () {
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
    // 用 IntersectionObserver 观察 Hero，滚过首屏后再显示「回到顶部」按钮
    var heroEl = document.getElementById("hero");
    var siteHeader = document.getElementById("site-header");
    if (heroEl && "IntersectionObserver" in window) {
      var topSpy = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          backToTop.classList.toggle("visible", !entry.isIntersecting);
          if (siteHeader) siteHeader.classList.toggle("scrolled", !entry.isIntersecting);
        });
      }, { threshold: 0, rootMargin: "-80px 0px 0px 0px" });
      topSpy.observe(heroEl);
    }

    // 系统主题变化时，若为「跟随系统」则自动更新
    var mq = window.matchMedia("(prefers-color-scheme: dark)");
    if (mq.addEventListener) {
      mq.addEventListener("change", function () {
        if (getThemePref() === "auto") applyTheme();
      });
    }

    // 滚动时高亮当前导航项
    function setupScrollSpy() {
      var links = Array.prototype.slice.call(document.querySelectorAll(".nav-list a[href^='#']"));
      var sections = links.map(function (a) {
        return document.querySelector(a.getAttribute("href"));
      }).filter(Boolean);
      if (!("IntersectionObserver" in window)) return;
      var spy = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting) {
            links.forEach(function (a) {
              a.classList.toggle("active", a.getAttribute("href") === "#" + entry.target.id);
            });
          }
        });
      }, { rootMargin: "-45% 0px -50% 0px", threshold: 0 });
      sections.forEach(function (s) { spy.observe(s); });
    }

    function setupReveal() {
      var els = Array.prototype.slice.call(document.querySelectorAll(".reveal"));
      if (!("IntersectionObserver" in window)) {
        els.forEach(function (el) { el.classList.add("in"); });
        return;
      }
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting) {
            entry.target.classList.add("in");
            io.unobserve(entry.target);
          }
        });
      }, { threshold: 0.12, rootMargin: "0px 0px -8% 0px" });
      els.forEach(function (el) { io.observe(el); });
    }

    /* ---------------- 云同步动作 ---------------- */
    async function connectGitHub() {
      var pat = (document.getElementById("sync-pat").value || "").trim();
      var owner = (document.getElementById("sync-owner").value || "").trim();
      var repo = (document.getElementById("sync-repo").value || "").trim();
      var branch = (document.getElementById("sync-branch").value || "").trim() || "main";
      var path = (document.getElementById("sync-path").value || "").trim() || "data.json";
      if (!pat) { showToast("请先填入 Personal Access Token"); return; }
      syncConfig = { owner: owner || DEFAULT_SYNC_CONFIG.owner, repo: repo || DEFAULT_SYNC_CONFIG.repo, branch: branch, path: path };
      auth.pat = pat;
      try { localStorage.setItem(SYNC_PAT_KEY, pat); } catch (e) {}
      saveSyncConfig();
      updateSyncUI();
      var ok = await ghValidate();
      if (!ok) { updateSyncUI(); updateAuthUI(); return; }
      data = await loadData();
      renderAll();
      updateSyncUI();
      updateAuthUI();
      showToast("已连接 GitHub");
    }

    async function pullCloud() {
      if (!requireAuth()) return;
      data = await loadData();
      renderAll();
      updateSyncUI();
      showToast("已从云端加载最新数据");
    }

    function syncNow() {
      if (!requireAuth()) return;
      if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; }
      if (syncing) { rerun = true; showToast("正在同步，稍候自动完成"); return; }
      flushCloudSave();
    }

    function disconnect() {
      auth.pat = "";
      auth.connected = false;
      auth.sha = null;
      auth.error = null;
      try { localStorage.removeItem(SYNC_PAT_KEY); } catch (e) {}
      var patInput = document.getElementById("sync-pat");
      if (patInput) patInput.value = "";
      document.body.classList.remove("edit-mode");
      var btn = document.getElementById("edit-toggle");
      if (btn) { btn.textContent = "编辑模式"; btn.setAttribute("aria-pressed", "false"); }
      renderAll();
      updateSyncUI();
      updateAuthUI();
      showToast("已退出登录（只读模式）");
    }

    function updateSyncUI() {
      var el = document.getElementById("sync-status");
      if (!el) return;
      if (auth.connected) {
        el.textContent = "已连接 · " + syncConfig.owner + "/" + syncConfig.repo + " · " + syncConfig.branch + "/" + syncConfig.path;
        el.className = "sync-status ok";
      } else if (auth.error) {
        el.textContent = "未连接 · " + auth.error;
        el.className = "sync-status err";
      } else {
        el.textContent = "未连接（访客只读模式）";
        el.className = "sync-status";
      }
    }

    function updateAuthUI() {
      var btn = document.getElementById("edit-toggle");
      if (btn) btn.disabled = !isAuthenticated();
    }

    /* ---------------- 初始化（异步：先拉取云端数据） ---------------- */
    async function boot() {
      try {
        if (auth.pat) {
          await ghValidate();
        }
        data = await loadData();
        renderSettings();
        renderAll();
        updateSyncUI();
        updateAuthUI();
        setupScrollSpy();
        setupReveal();
      } catch (err) {
        console.error("boot error", err);
        showBanner("页面加载出错：" + (err && err.message || err), "err");
      } finally {
        var loader = document.getElementById("loader");
        if (loader) loader.hidden = true;
      }
      if (auth.error) {
        showBanner(auth.error, "err");
      }
    }

    applyTheme();
    boot();
  })();

  /* ============================================================
     跨设备同步（GitHub API）配置说明
     ------------------------------------------------------------
     本网站把完整数据保存在 GitHub 仓库的一个 JSON 文件里（默认 data.json）：
     - 访客（未填 Token）：只读，通过 raw.githubusercontent.com 拉取该文件；
     - 作者（已填 Token）：登录后可编辑，每次保存通过 GitHub Contents API
       提交一个 commit 更新 data.json，GitHub Pages 会自动重新部署。
     这样任何设备、任何浏览器打开网站，看到的都是同一份数据。

     你需要做的配置：
     1. 仓库保持公开，访客才能通过 raw 只读访问。
     2. 生成一个「细粒度 Personal Access Token」：
        GitHub → Settings → Developer settings → Personal access tokens
        → Fine-grained tokens → Generate new token
        - Repository access：Only select repositories →
          选择 bobor-dotty/bobor-dotty.github.io
        - Permissions：Repository permissions → Contents → Read and write
        - 其余权限保持关闭
        复制生成的 token（形如 github_pat_...）。
     3. 打开网站 → 设置 → 数据同步：
        - 确认用户名 / 仓库名 / 分支 / 数据文件路径（默认已填好）
        - 粘贴 token → 点「连接并验证」
        - 点「同步到云端」，把当前内容首次写入 data.json
     4. Token 只保存在本机浏览器 localStorage 里，请勿在公共电脑使用；
        若泄露，立刻在 GitHub 撤销该 token。

     备选方案（Supabase，适合以后多人协作或更严格鉴权）：
     创建 Supabase 项目 → 建表（notes / logs / projects / skills / about / meta）
     → 开启邮箱登录 → 用 Row Level Security 只允许登录用户写、所有人读，
     并把 SUPABASE_URL / SUPABASE_ANON_KEY 填入代码里的占位常量处即可。
     ============================================================ */
  </script>
</body>
</html>
